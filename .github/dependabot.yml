version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      # Effect's patcher and Oxlint plugins must support Vite+'s bundled Oxlint.
      # Keep this before the broader @effect/* and libraries groups.
      vite-toolchain:
        patterns:
          - "@effect/tsgo"
          - "@oxlint/*"
          - vite-plus
          - vite
          - "@voidzero-dev/*"
          - vitest
          - "@vitest/*"
          - esbuild
      effect:
        patterns:
          - effect
          - "@effect/*"
      # Update the Vite plugin and native React Compiler together; the generator
      # test checks the compiler satisfies the plugin's peer range.
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - oxc-transform-react
      libraries:
        patterns:
          - "*"
    ignore:
      # The Vue starter stays on TypeScript 5.9 until vue-tsc supports
      # TypeScript 7's package layout. Major upgrades need manual review.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
