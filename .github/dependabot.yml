version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      # Effect's patcher and Oxlint plugins must support Vite+'s bundled Oxlint.
      # Keep this before the broader @effect/* and libraries groups.
      vite-toolchain:
        patterns:
          - "@effect/tsgo"
          - "@oxlint/*"
          - vite-plus
          - vite
          - "@voidzero-dev/*"
          - vitest
          - "@vitest/*"
          - esbuild
      effect:
        patterns:
          - effect
          - "@effect/*"
      # Update the Vite plugin and native React Compiler together; the generator
      # test checks the compiler satisfies the plugin's peer range.
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - oxc-transform-react
      libraries:
        patterns:
          - "*"
    ignore:
      # @effect/tsgo patches a specific TypeScript build, so a major upgrade
      # needs manual review rather than an automated bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Vite+ bundles Vitest, and @vitest/browser-playwright peers on that exact
      # version. Bumping the provider alone leaves the override pointing at the
      # bundled one, which pnpm installs anyway and the browser project rejects.
      # Bump vitest, the provider and vite-plus together.
      - dependency-name: vitest
      - dependency-name: "@vitest/browser-playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
