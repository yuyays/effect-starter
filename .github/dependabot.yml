version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      vite-toolchain:
        patterns:
          - vite-plus
          - vite
          - "@voidzero-dev/*"
          - vitest
          - "@vitest/*"
          - esbuild
      effect:
        patterns:
          - effect
          - "@effect/*"
      libraries:
        patterns:
          - "*"
    ignore:
      # The Vue starter stays on TypeScript 5.9 until vue-tsc supports
      # TypeScript 7's package layout. Major upgrades need manual review.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @vitejs/plugin-react accepts one 0.x minor of the native React Compiler
      # (^0.152.0 today); bump it together with the plugin's peer range.
      - dependency-name: oxc-transform-react
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
