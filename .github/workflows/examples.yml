# One job per optional example. durable-agent needs real PostgreSQL; the Alchemy
# Durable Object example runs in workerd. A separate workflow keeps both out of the
# ci.yml that generated apps inherit, and keeps the base checks database-free.
name: Examples

on:
  # Examples need the shared catalogs and the API's tsconfig, and nothing else here
  # depends on them, so unrelated pull requests skip the PostgreSQL service.
  pull_request:
    paths:
      - "examples/**"
      - "apps/api/tsconfig.json"
      - "tsconfig.base.json"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/examples.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "apps/api/tsconfig.json"
      - "tsconfig.base.json"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:examples
      - run: pnpm test:examples
        env:
          DOC_REVIEW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  alchemy-durable-object:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/alchemy-durable-object/pnpm-lock.yaml
      # Standalone workspace: install and test without the root workspace.
      - run: pnpm install --frozen-lockfile
        working-directory: examples/alchemy-durable-object
      - run: pnpm test
        working-directory: examples/alchemy-durable-object
      - run: pnpm typecheck
        working-directory: examples/alchemy-durable-object
