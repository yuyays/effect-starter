name: Generated projects

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig.base.json"
      - "package.json"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/generated-projects.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig.base.json"
      - "package.json"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/generated-projects.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: generated-projects-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generated-projects:
    # `--framework none` generates the API without a frontend.
    name: ${{ matrix.framework == 'none' && 'api-only' || matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [react, tanstack-start, vue, none]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Generated Bun projects resolve the same versions as the pnpm lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # React starters' browser tests reuse this Playwright version's Chromium.
      - if: matrix.framework == 'react' || matrix.framework == 'tanstack-start'
        run: pnpm browser:install --with-deps
      - run: pnpm test:generated ${{ matrix.framework }}
