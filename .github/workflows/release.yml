name: Release generator

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  generated-projects:
    needs: source
    uses: ./.github/workflows/generated-projects.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  package:
    needs: [source, checks, generated-projects]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-effect-starter test
      - run: pnpm --filter create-effect-starter pack --out "$RUNNER_TEMP/create-effect-starter.tgz"
      - name: Verify all starters in the archive run through npx
        working-directory: ${{ runner.temp }}
        run: |
          for framework in react tanstack-start vue none; do
            npx --yes --package "$RUNNER_TEMP/create-effect-starter.tgz" -- \
              create-effect-starter "release-smoke-$framework" \
              --framework "$framework" --package-manager pnpm --no-install
          done
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: generator-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/create-effect-starter.tgz
          if-no-files-found: error

  release:
    needs: [source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: Create GitHub release with the packed CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag_ref=$(jq -rn --arg tag "refs/tags/$RELEASE_TAG" '$tag | @uri')
          tag_sha=$(gh api "repos/$GH_REPO/commits/$tag_ref" --jq .sha)
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "Release tag changed after validation" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/create-effect-starter.tgz" --verify-tag --generate-notes
