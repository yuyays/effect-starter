packages:
  - "apps/*"
  - "examples/durable-workflow"
  - "packages/*"
  - "packages/create-effect-starter/frontends/*"
# Shared versions: packages declare these as `catalog:` so they stay aligned.
# TypeScript stays out of the catalog: it is pinned in the root manifest because
# @effect/tsgo patches that exact compiler build.
catalog:
  # Pinned: 4.1.5 is blocked by minimumReleaseAge until a day after release.
  "@effect/atom-react": "4.1.4"
  "@effect/platform-node": "^4.1.4"
  "@effect/sql-pg": "^4.1.4"
  "@effect/vitest": "4.1.4"
  # Vitest's browser provider matches the Vitest override below.
  "@vitest/browser-playwright": "5.1.0"
  effect: "^4.1.4"
  playwright: "1.65.1"
  # Use the core version bundled by Vite+ across the workspace.
  vite: "npm:@voidzero-dev/vite-plus-core@8.3.8000"
  vite-plus: "1.7.0"
minimumReleaseAge: 1440
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
overrides:
  "vite@*": "catalog:"
  "vitest@*": 5.1.0

# Allow the Vite+ core version used by the catalog alias.
peerDependencyRules:
  allowedVersions:
    vite: "8.3.8000"
