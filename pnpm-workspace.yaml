packages:
  - "apps/*"
  - "examples/durable-workflow"
  - "packages/*"
  - "packages/create-effect-starter/frontends/*"
# Shared versions: packages declare these as `catalog:` so they stay aligned.
# TypeScript stays out of the catalog: it is pinned in the root manifest because
# @effect/tsgo patches that exact compiler build.
catalog:
  "@effect/platform-node": "^4.1.4"
  "@effect/sql-pg": "^4.1.4"
  "@effect/vitest": "4.1.4"
  # Vitest's browser provider matches the Vitest override below.
  "@vitest/browser-playwright": "5.1.1"
  effect: "^4.1.4"
  playwright: "1.65.1"
  # Match Vite+'s core version, Vitest override, and allowed Vite peer version below.
  vite: "npm:@voidzero-dev/vite-plus-core@1.6.0"
  vite-plus: "1.7.0"
minimumReleaseAge: 1440
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
overrides:
  "vite@*": "catalog:"
  "vitest@*": 5.1.0

# Vite+ core uses the toolchain version for its Vite 8-compatible alias.
peerDependencyRules:
  allowedVersions:
    vite: "1.6.0"
