packages:
  - "apps/*"
  - "examples/durable-agent"
  - "packages/*"
  - "packages/create-effect-starter/frontends/*"
# Shared versions: packages declare these as `catalog:` so they stay aligned.
# TypeScript is not here because the Vue starter pins its own version.
catalog:
  "@effect/platform-node": "^4.1.2"
  "@effect/sql-pg": "^4.1.2"
  "@effect/vitest": "4.1.2"
  # Vitest's browser provider matches the Vitest override below.
  "@vitest/browser-playwright": "5.1.0"
  effect: "^4.1.2"
  playwright: "1.64.1"
  # Match Vite+'s core version, Vitest override, and allowed Vite peer version below.
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  vite-plus: "1.5.0"
minimumReleaseAge: 1440
allowBuilds:
  "vue-demi": true
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
overrides:
  "vite@*": "catalog:"
  "vitest@*": 5.1.0

# Vite+ core uses the toolchain version for its Vite 8-compatible alias.
peerDependencyRules:
  allowedVersions:
    vite: "1.5.0"
